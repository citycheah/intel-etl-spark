name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  spark-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --extra dev
      - run: uv run ruff check intel_etl_spark scripts tests
      - run: uv run pytest
