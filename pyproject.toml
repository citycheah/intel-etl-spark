[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "intel-etl-spark"
version = "0.1.0"
description = "PySpark 2-stage Medallion ETL (Bronze->Silver->Gold) & EU Automotive synthetic DGP generator for the Creative Intelligence Suite."
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.11,<3.13"
authors = [
    {name = "Cheah Chuen Thong"},
]
dependencies = [
    "intel-core>=0.1.0",
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "pyarrow>=15.0.0",
    "pydantic>=2.6.0,<3.0.0",
    "pyspark>=3.5.0,<4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[tool.uv.sources]
intel-core = { git = "https://github.com/citycheah/intel-core.git", tag = "v0.1.0" }

[tool.hatch.build.targets.wheel]
packages = ["intel_etl_spark"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
